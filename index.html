<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Лаборатория Евгения Мешкова — Панель техника</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>

<style>
:root {
  --bg: #0f0f17; --card: #1a1a28; --inner: #0f0f17; --border: #2a2a3a;
  --text: #e8e8f0; --dim: #8888a0; --mute: #55556a;
  --accent: #a855f7; --accent2: #10b981; --danger: #ef4444; --warn: #f59e0b;
  --info: #0ea5e9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
h1 { font-size: 18px; color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 8px; background: var(--border); color: var(--dim); }
.badge.on { background: var(--accent2); color: #fff; }
.me { font-size: 11px; color: var(--dim); margin-bottom: 16px; }
.section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
input, select, textarea { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--inner); color: var(--text); font-size: 13px; width: 100%; font-family: inherit; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }
button { padding: 10px 16px; border: none; border-radius: 8px; background: var(--accent2); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity .2s; white-space: nowrap; }
button:hover { opacity: .85; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
button.danger { background: var(--danger); }
button.warn { background: var(--warn); color: #000; }
button.small { padding: 6px 10px; font-size: 11px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { flex: 1 1 100px; padding: 9px; background: var(--card); border: 1px solid var(--border); color: var(--dim); border-radius: 8px; font-weight: 700; font-size: 12px; }
.tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.search-wrap { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }
.search-wrap:focus-within { border-color: var(--accent); }
.search-wrap input { border: none; background: transparent; padding: 4px 0; font-size: 14px; }
.search-wrap input:focus { border: none; }

/* === СХЕМА ЗУБОВ (ПК) === */
.teeth-wrapper { margin-top: 16px; }
.teeth-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.teeth-title { font-size: 12px; font-weight: bold; color: var(--dim); }
.teeth-label { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.teeth-label b { color: var(--accent2); font-family: monospace; font-size: 15px; }
.teeth-chart { display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at center, #151522 0%, #0a0a12 100%); padding: 30px 10px; border-radius: 16px; border: 1px solid var(--border); box-shadow: inset 0 0 50px rgba(0,0,0,0.9); position: relative; }
.jaw { display: flex; justify-content: center; position: relative; }
.jaw.upper { align-items: flex-end; margin-bottom: 15px; }
.jaw.lower { align-items: flex-start; margin-top: 15px; }
.quadrant { display: flex; gap: 4px; }
.midline { width: 2px; height: 40px; background: var(--border); margin: 0 10px; align-self: center; opacity: 0.5; box-shadow: 0 0 8px rgba(255,255,255,0.1); }
.tooth-btn { width: 34px; height: 48px; background: linear-gradient(180deg, #2a2a3a 0%, #1a1a28 100%); border: 1px solid #3a3a4a; border-radius: 16px 16px 6px 6px; color: #8888a0; font-size: 12px; font-weight: 800; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; cursor: pointer; user-select: none; z-index: 1; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.jaw.lower .tooth-btn { border-radius: 6px 6px 16px 16px; background: linear-gradient(0deg, #2a2a3a 0%, #1a1a28 100%); align-items: flex-start; padding-top: 8px; padding-bottom: 0; }
.tooth-btn:hover { z-index: 10; border-color: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(168,85,247,0.4); }
.tooth-btn.selected { background: linear-gradient(180deg, #10b981 0%, #059669 100%); border-color: #34d399; color: #fff; z-index: 5; box-shadow: 0 0 15px rgba(16,185,129,0.6); }
.jaw.lower .tooth-btn.selected { background: linear-gradient(0deg, #10b981 0%, #059669 100%); }
.jaw.upper .tooth-btn { transform-origin: bottom center; }
.jaw.lower .tooth-btn { transform-origin: top center; }
[data-n="18"] { transform: translateY(-22px) rotate(-38deg); }
[data-n="17"] { transform: translateY(-14px) rotate(-28deg); }
[data-n="16"] { transform: translateY(-7px) rotate(-18deg); }
[data-n="15"] { transform: translateY(-2px) rotate(-8deg); }
[data-n="14"], [data-n="13"], [data-n="12"], [data-n="11"] { transform: translateY(0px) rotate(0deg); }
[data-n="21"], [data-n="22"], [data-n="23"], [data-n="24"] { transform: translateY(0px) rotate(0deg); }
[data-n="25"] { transform: translateY(-2px) rotate(8deg); }
[data-n="26"] { transform: translateY(-7px) rotate(18deg); }
[data-n="27"] { transform: translateY(-14px) rotate(28deg); }
[data-n="28"] { transform: translateY(-22px) rotate(38deg); }
[data-n="48"] { transform: translateY(22px) rotate(38deg); }
[data-n="47"] { transform: translateY(14px) rotate(28deg); }
[data-n="46"] { transform: translateY(7px) rotate(18deg); }
[data-n="45"] { transform: translateY(2px) rotate(8deg); }
[data-n="44"], [data-n="43"], [data-n="42"], [data-n="41"] { transform: translateY(0px) rotate(0deg); }
[data-n="31"], [data-n="32"], [data-n="33"], [data-n="34"] { transform: translateY(0px) rotate(0deg); }
[data-n="35"] { transform: translateY(2px) rotate(-8deg); }
[data-n="36"] { transform: translateY(7px) rotate(-18deg); }
[data-n="37"] { transform: translateY(14px) rotate(-28deg); }
[data-n="38"] { transform: translateY(22px) rotate(-38deg); }

.card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--mute); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.card.status-received { border-left-color: var(--info); }
.card.status-modeling { border-left-color: var(--accent); }
.card.status-production { border-left-color: var(--warn); }
.card.status-finishing { border-left-color: #f97316; }
.card.status-tryin { border-left-color: #eab308; }
.card.status-ready { border-left-color: var(--accent2); }
.card.status-delivered { border-left-color: var(--mute); opacity: .65; }
.card.status-cancelled { border-left-color: var(--danger); opacity: .6; }
.card.overdue { box-shadow: 0 0 0 2px var(--danger); }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.card-header b { font-size: 16px; }
.card-header .order-num { font-family: monospace; color: var(--accent2); cursor: pointer; }
.card-row { font-size: 12px; margin-bottom: 3px; line-height: 1.4; }
.card-row.small { font-size: 11px; color: var(--dim); }
.card-row b { color: var(--text); }
.deadline { font-family: monospace; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: var(--inner); border: 1px solid var(--border); }
.deadline.ok { color: var(--accent2); }
.deadline.soon { color: var(--warn); }
.deadline.urgent { color: #f97316; }
.deadline.overdue { color: var(--danger); border-color: var(--danger); }
.progress { height: 6px; background: var(--inner); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--accent2), #00ff88); transition: width .3s; }
.actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.empty { text-align: center; color: var(--mute); padding: 30px; font-size: 13px; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--accent2); color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; z-index: 9999; box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 90%; text-align: center; animation: toastIn .2s ease; }
.toast.err { background: var(--danger); }
.toast.warn { background: var(--warn); color: #000; }
@keyframes toastIn { from { transform: translateX(-50%) translateY(-10px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
.modal { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 22px; max-width: 440px; width: 100%; }
.modal h3 { font-size: 16px; color: var(--accent); margin-bottom: 12px; text-align: center; }
.modal p { font-size: 12px; color: var(--dim); margin-bottom: 12px; text-align: center; }
.pin-row { display: flex; gap: 6px; margin-top: 8px; }
.pin-row input { flex: 1; text-align: center; font-family: monospace; font-size: 20px; letter-spacing: 6px; -webkit-text-security: disc; }
.pin-error { color: var(--danger); font-size: 12px; text-align: center; min-height: 16px; margin-top: 6px; }
.date-group { margin-bottom: 10px; }
.date-summary { padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; user-select: none; }
.date-summary::-webkit-details-marker { display: none; }
details[open] > .date-summary { margin-bottom: 8px; }
.date-content { padding-left: 12px; border-left: 2px solid var(--border); }

/* Оверлей импорта */
.import-progress-bar { height: 16px; background: var(--inner); border-radius: 8px; overflow: hidden; margin: 15px 0; border: 1px solid var(--border); }
.import-progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), #00ff88); transition: width .3s; width: 0%; }

@media (max-width: 768px) { 
  body { padding: 10px; } 
  .form-grid { grid-template-columns: 1fr 1fr; } 
  .card-header b { font-size: 14px; }
  .teeth-chart { display: flex; flex-direction: column; padding: 12px; border-radius: 8px; background: var(--inner); border: 1px solid var(--border); gap: 8px; }
  .jaw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 100%; margin: 0 !important; }
  .quadrant { display: contents; } 
  .midline { display: none; } 
  .tooth-btn, .jaw.lower .tooth-btn { width: 100%; height: auto; aspect-ratio: 1 / 1; padding: 0; margin: 0; transform: none !important; border-radius: 4px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; color: var(--text); box-shadow: none; }
  .tooth-btn.selected, .jaw.lower .tooth-btn.selected { background: var(--accent2); color: #fff; border-color: var(--accent2); box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
}
</style>
</head>
<body>
<h1>🦷 Лаборатория Евгения Мешкова <span id="connBadge" class="badge">⏳</span> <span class="badge" style="background:var(--accent); color:#fff;">v2.4</span></h1>
<div class="me" id="meInfo">Загрузка…</div>

<div style="margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;">
  <button class="danger" onclick="clearDB()">🧹 Очистить базу</button>
  <button class="warn" onclick="document.getElementById('jsonFileInput').click()">📥 Импорт из базы (JSON)</button>
  <input type="file" id="jsonFileInput" accept=".json" style="display:none" onchange="importJSON(this)">
</div>

<div class="section" id="addSection" style="display:none;">
  <h2>➕ Новый наряд</h2>
  <div class="form-grid">
    <input id="fOrderNum" placeholder="№ наряда" />
    <input id="fPatient" placeholder="ФИО пациента" />
    <input id="fClinic" placeholder="Клиника / врач" />
    <select id="fType">
      <option value="">Тип работы</option>
      <option>Коронка</option><option>Винир</option><option>Мост</option>
      <option>Вкладка</option><option>Бюгель</option><option>Съёмный протез</option>
      <option>Абатмент</option><option>Каппа</option><option>Ретейнер</option>
      <option>Другое</option>
    </select>
    <select id="fMaterial">
      <option value="">Материал</option>
      <option>Цирконий</option><option>E.max</option><option>Металлокерамика</option>
      <option>ПММА</option><option>Титан</option><option>CoCr</option><option>Воск</option>
      <option>Другое</option>
    </select>
    <input id="fColor" placeholder="Цвет VITA (A1, A2…)" />
    <input id="fPrice" type="number" placeholder="Стоимость ₽" />
    <input id="fPrepaid" type="number" placeholder="Предоплата ₽" />
    <input id="fDeadline" type="text" placeholder="Срок сдачи" readonly style="cursor: pointer;" />
    <input id="fNotes" placeholder="Примечания" style="grid-column: 1 / -1;" />
  </div>

  <div class="teeth-wrapper">
    <div class="teeth-header">
      <span class="teeth-title">🦷 Отметь зубы на схеме:</span>
      <div class="teeth-label">Выбрано: <b id="selectedTeethLabel">—</b></div>
    </div>
    <div class="teeth-chart" id="teethChart"></div>
    <div style="margin-top: 8px;">
      <button class="ghost small" onclick="clearTeeth()">Сбросить всё</button>
    </div>
  </div>

  <div class="actions" style="margin-top: 16px;"><button onclick="addOrder()">💾 Сохранить наряд</button></div>
</div>

<div class="search-wrap">
  <span>🔍</span>
  <input id="searchInput" placeholder="Поиск по пациенту, клинике, номеру…" oninput="window.render()" />
  <button class="ghost small" onclick="document.getElementById('searchInput').value='';window.render();" style="display:none;" id="searchClearBtn">×</button>
</div>

<div class="tabs" id="tabs">
  <button data-tab="active" class="active" onclick="setTab('active')">🔥 В работе</button>
  <button data-tab="ready" onclick="setTab('ready')">✅ Готово</button>
  <button data-tab="archive" onclick="setTab('archive')">📦 Архив</button>
</div>

<div id="content" class="empty">Загрузка…</div>
<button id="loadMoreBtn" class="ghost" style="display:none; width:100%; margin-top:10px;" onclick="loadMore()">Показать еще 100</button>

<!-- Оверлей прогресса импорта -->
<div id="importOverlay" class="overlay" style="display:none;">
  <div class="modal" style="text-align:center;">
    <h3>⏳ Загрузка базы</h3>
    <div style="font-size: 24px; font-weight: bold; margin: 15px 0; color: var(--accent2);" id="importProgressText">0 / 0</div>
    <div class="import-progress-bar"><div id="importProgressBar"></div></div>
    <p id="importStatusText" style="font-size: 14px; margin-top: 10px;">Пожалуйста, не закрывайте вкладку...</p>
    <div style="margin-top: 15px; font-size: 11px; color: var(--mute);">Обычно это занимает 1-2 минуты</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD1a18cQ8PKTWb5E5-FgDMB1TpfcKTQNXM",
  authDomain: "zubki-cfc5b.firebaseapp.com",
  projectId: "zubki-cfc5b",
  storageBucket: "zubki-cfc5b.firebasestorage.app",
  messagingSenderId: "5447130077",
  appId: "1:5447130077:web:70ed19c33eefc22a70f434"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const COLLECTION = 'orders';
const PIN_KEY = 'dtlab_pin_hash';
let orders = [], currentTab = 'active', searchQuery = '';
let visibleCount = 100;
window.showFullArchive = false;

// --- ЛОГИКА ЗУБОВ ---
let selectedTeeth = new Set();

function initTeethChart() {
  const el = document.getElementById('teethChart');
  if (!el) return;
  const q1 = [18, 17, 16, 15, 14, 13, 12, 11];
  const q2 = [21, 22, 23, 24, 25, 26, 27, 28];
  const q4 = [48, 47, 46, 45, 44, 43, 42, 41];
  const q3 = [31, 32, 33, 34, 35, 36, 37, 38];
  const buildQuad = (arr) => arr.map(n => `<div class="tooth-btn" data-n="${n}" onclick="toggleTooth(${n})">${n}</div>`).join('');
  el.innerHTML = `
    <div class="jaw upper"><div class="quadrant">${buildQuad(q1)}</div><div class="midline"></div><div class="quadrant">${buildQuad(q2)}</div></div>
    <div class="jaw lower"><div class="quadrant">${buildQuad(q4)}</div><div class="midline"></div><div class="quadrant">${buildQuad(q3)}</div></div>
  `;
}

window.toggleTooth = (num) => {
  if (selectedTeeth.has(num)) selectedTeeth.delete(num);
  else selectedTeeth.add(num);
  const btn = document.querySelector(`.tooth-btn[data-n="${num}"]`);
  if (btn) btn.classList.toggle('selected', selectedTeeth.has(num));
  updateTeethLabel();
};

window.clearTeeth = () => {
  selectedTeeth.clear();
  document.querySelectorAll('.tooth-btn').forEach(btn => btn.classList.remove('selected'));
  updateTeethLabel();
};

function updateTeethLabel() {
  const label = document.getElementById('selectedTeethLabel');
  if (selectedTeeth.size === 0) label.textContent = '—';
  else {
    const sorted = Array.from(selectedTeeth).sort((a, b) => a - b);
    label.textContent = sorted.join(', ');
  }
}

// --- ФУНКЦИЯ ОЧИСТКИ БАЗЫ ---
window.clearDB = async function() {
  if (!confirm('⚠️ ВНИМАНИЕ! Это удалит ВСЕ наряды. Точно продолжить?')) return;
  showToast('🧹 Очищаем базу... Не закрывай вкладку!', 'info');
  
  try {
    const querySnapshot = await getDocs(collection(db, COLLECTION));
    let batch = writeBatch(db);
    let count = 0;
    
    const promises = [];
    querySnapshot.forEach((docSnap) => {
      batch.delete(docSnap.ref);
      count++;
      if (count === 500) {
        promises.push(batch.commit());
        batch = writeBatch(db);
        count = 0;
      }
    });
    if (count > 0) promises.push(batch.commit());
    await Promise.all(promises);
    
    showToast('✅ База полностью очищена!');
  } catch (e) {
    showToast('Ошибка очистки: ' + e.message, 'err');
  }
}

// --- СУПЕР-ИМПОРТ С ПРОГРЕСС-БАРОМ ---
window.importJSON = function(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const rawData = JSON.parse(e.target.result);
      
      let calcArr = [], docArr = [], detArr = [];
      if (rawData.calculations) calcArr = rawData.calculations;
      if (rawData.doctors) docArr = rawData.doctors;
      if (rawData.details) detArr = rawData.details;

      if (calcArr.length === 0 && detArr.length > 0) {
        calcArr = detArr.map(det => ({
          _id: det._id, doctorId: det.doctor, detailId: det._id, money: det.endPrice, calcDate: det.date_created
        }));
      }

      if (calcArr.length === 0) { showToast('❌ В файле нет нарядов.', 'err'); return; }

      // Показываем оверлей
      document.getElementById('importOverlay').style.display = 'flex';
      document.getElementById('importProgressText').textContent = `0 / ${calcArr.length}`;
      document.getElementById('importProgressBar').style.width = '0%';
      document.getElementById('importStatusText').textContent = 'Подготовка данных...';
      document.getElementById('importStatusText').style.color = 'var(--dim)';

      const doctorsMap = {}; docArr.forEach(d => doctorsMap[d._id || d.id] = d);
      const detailsMap = {}; detArr.forEach(d => detailsMap[d._id || d.id] = d);

      let batch = writeBatch(db);
      let count = 0;
      let successCount = 0;
      let hasError = false;

      for (let i = 0; i < calcArr.length; i++) {
        const calc = calcArr[i];
        
        try {
            const doctorData = doctorsMap[calc.doctorId || calc.doctor] || {};
            const detailData = detailsMap[calc.detailId || calc._id] || {};

            let teethStr = '';
            if (detailData.teeth) {
                try {
                    const teethData = JSON.parse(detailData.teeth);
                    if (teethData.teeth && Array.isArray(teethData.teeth)) teethStr = teethData.teeth.map(t => t.tooth).join(', ');
                } catch(e) { teethStr = String(detailData.teeth).replace(/\[|\]|\"|\'/g, ''); }
            }

            let orderTypeStr = '';
            if (detailData.elementsProsthesis) {
                try {
                    const elData = JSON.parse(detailData.elementsProsthesis);
                    if (elData.elementsProsthesis && Array.isArray(elData.elementsProsthesis) && elData.elementsProsthesis.length > 0) {
                        orderTypeStr = elData.elementsProsthesis.map(el => `Элемент ${el.elementProsthesis} (${el.count} шт.)`).join(', ');
                    }
                } catch(e) {
                    if (detailData.elementsProsthesis !== '{"data": "elementsProsthesisSelected", "elementsProsthesis": []}') orderTypeStr = detailData.elementsProsthesis;
                }
            }

            let colorStr = detailData.color || '';
            if (colorStr === '-1' || colorStr === '0') colorStr = '';

            let docFirstName = doctorData.name || doctorData.firstName || '';
            let docLastName = doctorData.soname || doctorData.lastName || doctorData.family || '';
            let docPatron = doctorData.patronymic || doctorData.middleName || '';
            let clinicStr = `${docLastName} ${docFirstName} ${docPatron}`.trim();

            if (!clinicStr) {
                clinicStr = doctorData.fio || doctorData.fullName || detailData.doctorName || '';
            }

            let dateStr = '';
            if (calc.calcDate || detailData.date_updated || detailData.date_created) {
                try {
                    const d = new Date(Number(calc.calcDate || detailData.date_updated || detailData.date_created));
                    if (!isNaN(d.getTime())) dateStr = d.toISOString().split('T')[0];
                } catch(e) {}
            }

            const pName = detailData.patientSoname || detailData.patientName || detailData.patientFio || detailData.fio || 'Пациент (импорт)';

            // Полностью защищаем данные от undefined, чтобы Firebase не падал
            const orderData = {
              patientName: pName || 'Пациент (импорт)',
              orderNumber: calc._id || calc.id || '—',
              clinic: clinicStr || '',
              orderType: orderTypeStr || '',
              material: '',
              vitaColor: colorStr || '',
              teeth: teethStr || '',
              price: parseFloat(calc.money || detailData.endPrice) || 0,
              prepaid: parseFloat(detailData.payedMoney) || 0,
              deadline: dateStr || '',
              notes: detailData.informationOrder || '',
              status: 'delivered', 
              createdAt: serverTimestamp(),
              payments: []
            };

            const newRef = doc(collection(db, COLLECTION));
            batch.set(newRef, orderData);
            count++;
        } catch (err) {
            console.error('Ошибка при обработке наряда', i, err);
        }

        if (count === 500 || i === calcArr.length - 1) {
          try {
            await batch.commit();
            successCount += count;
            count = 0;
            batch = writeBatch(db);

            // Обновляем прогресс
            const pct = Math.round((successCount / calcArr.length) * 100);
            document.getElementById('importProgressText').textContent = `${successCount} / ${calcArr.length}`;
            document.getElementById('importProgressBar').style.width = pct + '%';
            document.getElementById('importStatusText').textContent = `Отправлено пакетов: ${Math.ceil(successCount/500)}...`;
            
          } catch (batchError) {
            console.error("Ошибка пакета:", batchError);
            hasError = true;
            document.getElementById('importStatusText').textContent = `Ошибка базы: ${batchError.message}`;
            document.getElementById('importStatusText').style.color = 'var(--danger)';
            batch = writeBatch(db);
            count = 0;
            // Пауза, чтобы не спамить сервер при сбое сети
            await new Promise(r => setTimeout(r, 1500));
          }
        }
      }

      // Финал
      document.getElementById('importStatusText').textContent = hasError ? 'Загрузка завершена с ошибками (часть данных пропущена)' : '✅ Импорт успешно завершен!';
      document.getElementById('importStatusText').style.color = hasError ? 'var(--warn)' : 'var(--accent2)';
      
      setTimeout(() => {
        document.getElementById('importOverlay').style.display = 'none';
        input.value = '';
        setTab('archive');
      }, 2000);

    } catch(err) { console.error(err); showToast('❌ Ошибка: ' + err.message, 'err'); }
  };
  reader.readAsText(file);
};

flatpickr("#fDeadline", { locale: "ru", dateFormat: "Y-m-d", altInput: true, altFormat: "d.m.Y", allowInput: false, disableMobile: false });

async function initAuth() {
  return new Promise((resolve) => {
    onAuthStateChanged(auth, async (user) => {
      if (!user) { try { await signInAnonymously(auth); } catch(e) { showToast('Ошибка входа: '+e.message, 'err'); } }
      else { resolve(user); }
    });
  });
}

async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dtlab_salt_'+pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPin() {
  if (!localStorage.getItem(PIN_KEY)) return showPinSetup();
  return showPinPrompt();
}
function showPinSetup() {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'pinOverlay';
    ov.innerHTML = `<div class="modal"><h3>🔐 Первый вход</h3><p>Придумай PIN (4–6 цифр)</p><div class="pin-row"><input type="text" inputmode="numeric" maxlength="6" id="pin1" placeholder="PIN" autofocus></div><div class="pin-row"><input type="text" inputmode="numeric" maxlength="6" id="pin2" placeholder="Повтори PIN"></div><div class="pin-error" id="pinErr"></div><div class="actions" style="justify-content:center;margin-top:14px;"><button onclick="savePinSetup()">✅ Установить PIN</button></div></div>`;
    document.body.appendChild(ov);
    window.savePinSetup = async () => {
      const p1 = document.getElementById('pin1').value, p2 = document.getElementById('pin2').value, err = document.getElementById('pinErr');
      if (!/^\d{4,6}$/.test(p1)) { err.textContent = 'PIN — 4–6 цифр'; return; }
      if (p1 !== p2) { err.textContent = 'PIN не совпадает'; return; }
      localStorage.setItem(PIN_KEY, await hashPin(p1)); ov.remove(); resolve(true);
    };
  });
}
function showPinPrompt() {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'pinOverlay';
    ov.innerHTML = `<div class="modal"><h3>🔐 Вход в Лабораторию</h3><p>Введи PIN</p><div class="pin-row"><input type="text" inputmode="numeric" maxlength="6" id="pinInput" placeholder="••••" autofocus></div><div class="pin-error" id="pinErr"></div><div class="actions" style="justify-content:center;margin-top:14px;"><button onclick="verifyPin()">Войти</button></div></div>`;
    document.body.appendChild(ov);
    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') window.verifyPin(); });
    window.verifyPin = async () => {
      const pin = document.getElementById('pinInput').value, err = document.getElementById('pinErr'), saved = localStorage.getItem(PIN_KEY);
      if (await hashPin(pin) !== saved) { err.textContent = 'Неверный PIN'; document.getElementById('pinInput').value = ''; return; }
      ov.remove(); resolve(true);
    };
  });
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtMoney(n) { return Math.round(n || 0).toLocaleString('ru-RU') + ' ₽'; }
function showToast(msg, type = '') { const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 5000); }
const STATUS_LABELS = { received: '📥 Получен', modeling: '📐 Моделировка', production: '🔨 Литьё/фрезеровка', finishing: '🎨 Керамика', tryin: '👁 Примерка', ready: '✅ Готово', delivered: '📦 Выдано', cancelled: '❌ Отменён' };
const STATUS_ORDER = ['received','modeling','production','finishing','tryin','ready','delivered'];

function deadlineInfo(deadlineStr, status) {
  if (!deadlineStr || status === 'delivered') return { text: '—', cls: '' };
  const now = new Date(), dl = new Date(deadlineStr + 'T23:59:59'), diffMs = dl - now, diffDays = diffMs / 86400000;
  if (diffMs < 0) return { text: '⚠️ Просрочен', cls: 'overdue' };
  if (diffDays < 1) return { text: '⏰ < 1 дня', cls: 'urgent' };
  if (diffDays < 3) return { text: `⏳ ${Math.ceil(diffDays)} дн.`, cls: 'soon' };
  return { text: `📅 ${deadlineStr}`, cls: 'ok' };
}

async function addOrder() {
  const orderNumber = document.getElementById('fOrderNum').value.trim(), patientName = document.getElementById('fPatient').value.trim();
  if (!patientName) { showToast('Укажи ФИО пациента', 'err'); return; }
  const teethStr = Array.from(selectedTeeth).sort((a,b)=>a-b).join(', ');
  const data = {
    orderNumber: orderNumber || '—', patientName, clinic: document.getElementById('fClinic').value.trim(),
    orderType: document.getElementById('fType').value, material: document.getElementById('fMaterial').value,
    vitaColor: document.getElementById('fColor').value.trim(), teeth: teethStr,
    price: parseFloat(document.getElementById('fPrice').value) || 0, prepaid: parseFloat(document.getElementById('fPrepaid').value) || 0,
    deadline: document.getElementById('fDeadline').value || '', notes: document.getElementById('fNotes').value.trim(),
    status: 'received', createdAt: serverTimestamp(), payments: []
  };
  try {
    await addDoc(collection(db, COLLECTION), data);
    ['fOrderNum','fPatient','fClinic','fType','fMaterial','fColor','fPrice','fPrepaid','fNotes'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    const fp = document.getElementById('fDeadline')._flatpickr;
    if (fp) fp.clear();
    clearTeeth();
    showToast('✅ Наряд создан');
  } catch(e) { showToast('Ошибка: ' + e.message, 'err'); }
}

async function setStatus(id, status) {
  await updateDoc(doc(db, COLLECTION, id), { status });
  showToast('Статус: ' + (STATUS_LABELS[status] || status));
}
async function removeOrder(id) { if (!confirm('Удалить наряд навсегда?')) return; await deleteDoc(doc(db, COLLECTION, id)); showToast('Наряд удалён'); }

function printOrder(id) {
  const o = orders.find(x => x.id === id); if (!o) return;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><meta charset="utf-8"><title>Наряд ${esc(o.orderNumber)}</title><style>body{font-family:Arial,sans-serif;padding:30px;max-width:700px;margin:auto}h1{font-size:20px;border-bottom:2px solid #000;padding-bottom:8px}table{width:100%;border-collapse:collapse;margin-top:16px}td{padding:8px;border-bottom:1px solid #ccc;font-size:14px}td:first-child{font-weight:bold;width:40%}</style></head><body><h1>🦷 Лаборатория Евгения Мешкова — Наряд ${esc(o.orderNumber)}</h1><table><tr><td>Пациент</td><td>${esc(o.patientName)}</td></tr><tr><td>Клиника / врач</td><td>${esc(o.clinic || '—')}</td></tr><tr><td>Тип работы</td><td>${esc(o.orderType || '—')}</td></tr><tr><td>Материал</td><td>${esc(o.material || '—')}</td></tr><tr><td>Цвет VITA</td><td>${esc(o.vitaColor || '—')}</td></tr><tr><td>Зубы</td><td>${esc(o.teeth || '—')}</td></tr><tr><td>Срок сдачи</td><td>${esc(o.deadline || '—')}</td></tr><tr><td>Стоимость</td><td>${fmtMoney(o.price)}</td></tr><tr><td>Предоплата</td><td>${fmtMoney(o.prepaid)}</td></tr><tr><td>Примечания</td><td>${esc(o.notes || '—')}</td></tr></table><p style="margin-top:24px;font-size:12px;color:#666">Создан: ${o.createdAt ? new Date(o.createdAt.seconds * 1000).toLocaleString('ru-RU') : '—'}</p></body></html>`);
  win.document.close(); win.print();
}

function renderCard(o) {
  const dl = deadlineInfo(o.deadline, o.status);
  const paid = (o.payments || []).reduce((s, p) => s + (p.sum || 0), 0) + (o.prepaid || 0);
  const isOverdue = o.deadline && new Date(o.deadline + 'T23:59:59') < new Date() && o.status !== 'delivered' && o.status !== 'cancelled';
  const stageIdx = STATUS_ORDER.indexOf(o.status), stagePct = stageIdx >= 0 ? ((stageIdx + 1) / STATUS_ORDER.length) * 100 : 0;
  let nextStatusHtml = '';
  if (o.status !== 'delivered' && o.status !== 'cancelled') {
    const next = STATUS_ORDER[stageIdx + 1];
    if (next) nextStatusHtml = `<button class="small" onclick="setStatus('${o.id}','${next}')">→ ${STATUS_LABELS[next]}</button>`;
  }
  return `<div class="card status-${o.status}${isOverdue ? ' overdue' : ''}"><div class="card-header"><b>${esc(o.patientName)}</b><span class="deadline ${dl.cls}">${dl.text}</span></div><div class="card-row small">№ <span class="order-num">${esc(o.orderNumber)}</span> • ${STATUS_LABELS[o.status] || o.status}${isOverdue ? ' • ⚠️ ПРОСРОЧЕН' : ''}</div>${o.clinic ? `<div class="card-row">🏥 ${esc(o.clinic)}</div>` : ''}${o.orderType ? `<div class="card-row">🦷 ${esc(o.orderType)}${o.material ? ' • ' + esc(o.material) : ''}${o.vitaColor ? ' • ' + esc(o.vitaColor) : ''}</div>` : ''}${o.teeth ? `<div class="card-row small" style="color:var(--accent2); font-weight:bold;">Зубы: ${esc(o.teeth)}</div>` : ''}${o.notes ? `<div class="card-row small">📝 ${esc(o.notes)}</div>` : ''}<div class="progress"><div style="width:${stagePct}%"></div></div><div class="card-row small">Этап: ${STATUS_LABELS[o.status] || o.status} • Оплачено: <b>${fmtMoney(paid)}</b> / ${fmtMoney(o.price)}</div><div class="actions">${nextStatusHtml}${o.status === 'ready' ? `<button class="small warn" onclick="setStatus('${o.id}','delivered')">📦 Выдать</button>` : ''}${o.status === 'delivered' ? `<button class="small ghost" onclick="setStatus('${o.id}','ready')">↩ Вернуть</button>` : ''}<button class="small ghost" onclick="printOrder('${o.id}')">🖨 Печать</button><button class="small danger" onclick="removeOrder('${o.id}')">×</button></div></div>`;
}

window.loadMore = function() {
  visibleCount += 100;
  render();
}

function render() {
  const content = document.getElementById('content'), q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  document.getElementById('searchClearBtn').style.display = q ? 'block' : 'none';
  document.getElementById('loadMoreBtn').style.display = 'none';
  
  let baseList = orders.filter(o => {
    if (currentTab === 'active') return !['delivered','cancelled'].includes(o.status);
    if (currentTab === 'ready') return o.status === 'ready';
    if (currentTab === 'archive') return ['delivered','cancelled'].includes(o.status);
    return true;
  });

  if (currentTab === 'archive' && q.length === 0 && !window.showFullArchive) {
    content.innerHTML = `
      <div class="empty" style="padding: 60px 20px; background: var(--card); border-radius: 12px; border: 1px dashed var(--border);">
        <div style="font-size: 40px; margin-bottom: 15px;">📦</div>
        <div style="font-size: 16px; color: var(--text); margin-bottom: 10px; font-weight: bold;">Архив (${baseList.length} нарядов)</div>
        <div style="color: var(--dim); margin-bottom: 20px; line-height: 1.5;">Чтобы не перегружать браузер, архив скрыт.<br>Введите ФИО, номер наряда или клинику в строку поиска выше.</div>
        <button class="ghost" onclick="window.showFullArchive = true; render();">Посмотреть последние 100</button>
      </div>
    `;
    return;
  }

  if (currentTab !== 'archive') window.showFullArchive = false;

  let list = baseList;
  if (q.length > 0) {
    list = list.filter(o => JSON.stringify(o).toLowerCase().includes(q));
  }

  if (!list.length) { 
    content.innerHTML = `<div class="empty">${q ? 'Ничего не найдено' : currentTab === 'active' ? 'Нет активных нарядов' : currentTab === 'ready' ? 'Нет готовых нарядов' : 'Архив пуст'}</div>`; 
    return; 
  }

  list.sort((a, b) => {
    if (currentTab === 'archive') {
        return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
    }
    return (a.deadline || '9999').localeCompare(b.deadline || '9999');
  });

  const total = list.length;
  const slicedList = list.slice(0, visibleCount);

  if (currentTab === 'archive') {
    const byDate = {};
    slicedList.forEach(o => { 
        const d = o.createdAt ? new Date(o.createdAt.seconds * 1000) : new Date(); 
        const key = d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }); 
        if (!byDate[key]) byDate[key] = { items: [], latest: 0 }; 
        byDate[key].items.push(o); 
        if (d.getTime() > byDate[key].latest) byDate[key].latest = d.getTime(); 
    });
    const sortedDates = Object.keys(byDate).sort((a, b) => byDate[b].latest - byDate[a].latest);
    content.innerHTML = sortedDates.map((dateKey, idx) => `<details class="date-group" ${idx === 0 ? 'open' : ''}><summary class="date-summary"><span>📅 ${dateKey}</span><span>${byDate[dateKey].items.length} наряд(ов) • ${fmtMoney(byDate[dateKey].items.reduce((s, o) => s + (o.price || 0), 0))}</span></summary><div class="date-content">${byDate[dateKey].items.map(renderCard).join('')}</div></details>`).join('');
  } else {
    content.innerHTML = slicedList.map(renderCard).join('');
  }

  if (total > visibleCount) {
    const btn = document.getElementById('loadMoreBtn');
    btn.style.display = 'block';
    btn.textContent = `Показать еще 100 (из ${total - visibleCount} оставшихся)`;
  }
}

function setTab(tab) { 
  currentTab = tab; 
  visibleCount = 100; 
  window.showFullArchive = false; 
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab)); 
  render(); 
}

function subscribe() {
  const q = query(collection(db, COLLECTION), orderBy('createdAt', 'desc'));
  onSnapshot(q, snapshot => { 
      orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() })); 
      document.getElementById('connBadge').textContent = '🟢 Онлайн'; 
      document.getElementById('connBadge').className = 'badge on'; 
      render(); 
  }, err => { 
      document.getElementById('connBadge').textContent = '🔴 Ошибка'; 
      document.getElementById('connBadge').className = 'badge'; 
      document.getElementById('content').innerHTML = `<div class="empty">Ошибка загрузки: ${esc(err.message)}</div>`; 
  });
}
(async function init() {
  initTeethChart();
  await initAuth(); 
  await checkPin(); 
  document.getElementById('meInfo').textContent = '🛠 Техник • Лаборатория Евгения Мешкова'; 
  document.getElementById('addSection').style.display = 'block'; 
  subscribe(); 
  setInterval(render, 60000);
})();
Object.assign(window, { addOrder, setStatus, removeOrder, printOrder, setTab, render, toggleTooth, clearTeeth, importJSON, clearDB, loadMore });
